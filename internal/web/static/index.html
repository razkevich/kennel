<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kennel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="logo"><span class="face">▼•ᴥ•▼</span> kennel</div>

  <div id="counts"></div>
  <button id="themebtn" type="button" title="Appearance">🖥 Auto</button>
  <div class="search">
    <input id="q" type="search" placeholder="Search names, prompts, transcripts…  ( / )" autocomplete="off" spellcheck="false">
    <div id="results" hidden></div>
  </div>
</header>

<main>
  <div id="stage">
    <canvas id="map" aria-label="kennel map"></canvas>
    
    <div id="library" hidden>
      <div class="libbar">
        <b>📚 Library</b>
        <input id="libq" type="search" placeholder="filter by title, ask, repo, theme…">
        <select id="libwhen"><option value="1">24h</option><option value="7">7 days</option><option value="14" selected>2 weeks</option><option value="30">30 days</option><option value="0">all time</option></select>
        <select id="libagent"><option value="">any agent</option><option value="claude">Claude</option><option value="codex">Codex</option><option value="cursor">Cursor</option></select>
        <select id="libkennel"></select>
        <select id="libtheme"></select>
        <label>group <select id="libgroup"><option value="day">day</option><option value="week">week</option><option value="theme">theme</option><option value="kennel">kennel</option><option value="repo">repo</option><option value="agent">agent</option><option value="none">none</option></select></label>
        <label>sort <select id="libsort"><option value="new">newest</option><option value="old">oldest</option><option value="msgs">most messages</option><option value="cost">cost</option></select></label>
        <button id="libthemes" title="categorize with an LLM">✨ Themes</button>
        <button id="libclose" title="close (Esc)">✕</button>
      </div>
      <div class="libsel" id="libsel" hidden><span id="libselcount"></span><select id="libmove"></select><button id="libdo">move</button><button id="libclear">clear</button></div>
      <div id="libbody"></div>
    </div>
    <aside id="floornav" aria-label="projects, floors and chats">
      <div id="navgrip" title="drag to resize"></div>
      <div class="fhead"><b>📁 Projects</b><button id="addspacebtn" title="start a project">＋</button></div>
      <nav id="spaces"></nav>
      <div class="fsep grip" data-grip="spaces" title="drag to resize"></div>
      <div class="fhead"><b>🏢 Floors</b><button id="addfloorbtn" title="new floor">＋</button></div>
      <nav id="floors"></nav>
      <button id="organizefloors" title="Let the model group your kennels into floors; you review before anything moves">✨ Organize into floors</button>
      <div class="fsep grip" data-grip="floors" title="drag to resize"></div>
      <div class="fhead"><b>💬 Chats</b><select id="chatsort" title="sort"><option value="active">active first</option><option value="recent">most recent</option><option value="messages">most active</option><option value="cost">most expensive</option><option value="name">name</option></select></div>
      <input id="chatq" type="search" placeholder="Search chats…">
      <nav id="chats"></nav>
      <button id="chatsortinto" hidden></button>
    </aside>
    <div id="tools" role="toolbar" aria-label="tools">
      <button data-tool="select" title="Select: drag pups, move and resize rooms (V)">↖<i>1</i></button>
      <button data-tool="hand" title="Hand: pan the map (H, or hold Space)">✋<i>2</i></button>
      <button data-tool="room" title="Kennel: draw a new kennel (R)">▭<i>3</i></button>
    </div>
    <div id="zoom"><button id="zoomout" title="zoom out (-)">−</button><button id="zoomval" title="reset zoom">100%</button><button id="zoomin" title="zoom in (+)">+</button><button id="zoomfit" title="fit everything (Shift+1)">⤢</button></div>
    <div id="ctxmenu" hidden></div>
    <div id="dock">
      <button id="libbtn" class="dockbtn" title="all sessions (L)"><span>📚</span>Library</button>
      <button id="buildbtn" class="dockbtn" title="design rooms and add new ones (B)"><span>🎨</span>Design</button>
      <button id="helpbtn" class="dockbtn icon" title="help">?</button>
    </div>
  </div>
  <aside id="side">
    <div id="sidegrip" title="drag to resize"></div>
    <div id="card" hidden></div>
    <div class="tabs">
      <button data-tab="term" class="on" title="The selected pup's terminal">🖥 Terminal</button>
      <button data-tab="ask" title="Ask">💬</button>
      <button data-tab="jobs" title="Jobs & things">⏰</button>
      <button data-tab="art" title="Shelf: artifacts, links, files, channels">📎</button>
      <button data-tab="build" title="Design: the selected room, or rooms to add">🎨</button>
    </div>
    <section id="term"></section>
    <section id="build" hidden></section>
    <section id="jobs" hidden></section>
    <section id="art" hidden></section>
    <section id="ask" hidden>
      <form id="askform">
        <textarea id="askq" rows="3" placeholder="Ask your pack… e.g. what did we decide about the postgres upgrade?"></textarea>
        <button type="submit">Ask</button>
      </form>
      <div id="askstage"></div>
      <div id="answer"></div>
      <div id="sources"></div>
    </section>
  </aside>
</main>

<div id="floorsheet" hidden><div class="sheet"><div class="bar"><b>✨ Organize kennels into floors</b><span>Suggestions only: pick a floor for each kennel, then apply. One ⌘Z undoes it.</span></div><div class="body"></div><div class="foot"><button class="cancel">Cancel</button><button class="apply">Apply</button></div></div></div>
<div id="sort" hidden><div class="sheet"><div class="bar"><b>✨ Sort new sessions into kennels</b><span>Suggestions only: change any row, then file.</span></div><div class="body"></div><div class="foot"><button class="cancel">Cancel</button><button class="apply">File</button></div></div></div>
<div id="transcript" hidden>
  <div class="sheet">
    <div class="bar"><b id="tr-title"></b><input id="tr-find" type="search" placeholder="find in transcript"><button id="tr-close">✕</button></div>
    <div id="tr-body"></div>
  </div>
</div>
<div id="toast" hidden></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="app.js"></script>
</body>
</html>
